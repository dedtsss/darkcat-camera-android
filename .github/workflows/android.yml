name: Android build

on:
  push:
    branches: [ main, 'feature/**', 'agent/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build, unit tests and lint
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug
      - name: Name debug artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk darkcat-camera-linked-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: darkcat-camera-linked-debug
          path: darkcat-camera-linked-debug.apk
