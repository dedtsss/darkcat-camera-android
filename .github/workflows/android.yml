name: Android
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare test build identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/ap-260820-2333-camera-mvp1-delivery'
        shell: bash
        run: |
          set -euo pipefail
          echo "TEST_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "TEST_VERSION_NAME=0.1.0-test.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "BRUCE_LATEST_URL=https://darkcat.bruce-group.net/test/latest.json" >> "$GITHUB_ENV"
          echo "BRUCE_TEST_APK_URL=https://darkcat.bruce-group.net/test/latest.apk" >> "$GITHUB_ENV"
          echo "BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build, test, lint
        env:
          GIT_SHA: ${{ github.sha }}
          BRUCE_DIAGNOSTICS_URL: ${{ vars.BRUCE_DIAGNOSTICS_URL }}
        run: gradle testDebugUnitTest lintDebug assembleDebug
      - name: Create Bruce publication manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sha256sum app/build/outputs/apk/debug/*.apk > app/build/outputs/apk/debug/SHA256SUMS
          APK=$(basename app/build/outputs/apk/debug/*.apk)
          SHA=$(awk '{print $1}' app/build/outputs/apk/debug/SHA256SUMS)
          printf '{"versionName":"0.1.0","versionCode":1,"gitSha":"%s","apk":"%s","sha256":"%s"}\n' "$GITHUB_SHA" "$APK" "$SHA" > app/build/outputs/apk/debug/latest.json
      - name: Publish Bruce artifacts over SFTP
        if: startsWith(github.ref, 'refs/tags/')
        env:
          BRUCE_SFTP_HOST: ${{ secrets.BRUCE_SFTP_HOST }}
          BRUCE_SFTP_USER: ${{ secrets.BRUCE_SFTP_USER }}
          BRUCE_SFTP_PATH: ${{ secrets.BRUCE_SFTP_PATH }}
          BRUCE_SFTP_KEY: ${{ secrets.BRUCE_SFTP_KEY }}
          BRUCE_SFTP_KNOWN_HOSTS: ${{ secrets.BRUCE_SFTP_KNOWN_HOSTS }}
        run: |
          key_file=$(mktemp)
          known_hosts_file=$(mktemp)
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          umask 077
          printf '%s\n' "$BRUCE_SFTP_KEY" > "$key_file"
          printf '%s\n' "$BRUCE_SFTP_KNOWN_HOSTS" > "$known_hosts_file"
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          scp -i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" \
            "$APK" app/build/outputs/apk/debug/latest.json app/build/outputs/apk/debug/SHA256SUMS \
            "$BRUCE_SFTP_USER@$BRUCE_SFTP_HOST:$BRUCE_SFTP_PATH/"
      - name: Create test publication manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/ap-260820-2333-camera-mvp1-delivery'
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          APK_NAME="darkcat-camera-${TEST_VERSION_NAME}.apk"
          PUBLISHED_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"versionName":"%s","versionCode":%s,"gitSha":"%s","channel":"test","apk":"%s","sha256":"%s","buildTimestamp":"%s","publishedTimestamp":"%s"}\n' \
            "$TEST_VERSION_NAME" "$TEST_VERSION_CODE" "$GITHUB_SHA" "$BRUCE_TEST_APK_URL" "$SHA" "$BUILD_TIMESTAMP" "$PUBLISHED_TIMESTAMP" \
            > app/build/outputs/apk/debug/latest.json
          jq -e . app/build/outputs/apk/debug/latest.json >/dev/null
          printf '%s  %s\n' "$SHA" "$APK_NAME" > app/build/outputs/apk/debug/SHA256SUMS
          cp "$APK" "app/build/outputs/apk/debug/$APK_NAME"
          cp app/build/outputs/apk/debug/latest.json "app/build/outputs/apk/debug/${APK_NAME%.apk}.json"
          cp app/build/outputs/apk/debug/SHA256SUMS "app/build/outputs/apk/debug/${APK_NAME%.apk}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: darkcat-camera-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.json
            app/build/outputs/apk/debug/*.sha256
            app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
