name: Android

on:
  push:
    branches: ["agent/lenscast-adoption-baseline"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build, unit test, lint, and assemble test APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug -PversionCode=$((100000 + GITHUB_RUN_NUMBER)) -PversionName=0.0.9-test.${GITHUB_RUN_NUMBER}
      - name: Assemble unsigned publishable release APK
        run: ./gradlew assembleRelease -PversionCode=$((100000 + GITHUB_RUN_NUMBER)) -PversionName=0.0.9-test.${GITHUB_RUN_NUMBER}
      - name: Verify release APK is unsigned
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          ! "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$apk" >/dev/null 2>&1
      - name: Upload build diagnostics and clean unsigned release artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lenscast-test-build-${{ github.run_id }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 3

  emulator-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build debug APK
        run: ./gradlew assembleDebug -PversionCode=$((100000 + GITHUB_RUN_NUMBER)) -PversionName=0.0.9-test.${GITHUB_RUN_NUMBER}
      - name: Enable KVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq qemu-kvm
          sudo chmod 666 /dev/kvm
      - name: Run Android emulator smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back virtualscene
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lenscast-test-smoke-${{ github.run_id }}
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          if-no-files-found: ignore
          retention-days: 3
