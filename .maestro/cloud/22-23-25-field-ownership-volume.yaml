appId: ru.darkcat.camera
name: CAT-22/23/25 Cloud Field ownership and Volume+ capture
tags:
  - cloud-expanded
  - cat-22
  - cat-23
  - cat-25
---
- setLocation:
    latitude: 55.755826
    longitude: 37.617300
- launchApp:
    clearState: false
    permissions:
      android.permission.CAMERA: allow
      android.permission.ACCESS_FINE_LOCATION: allow
      android.permission.POST_NOTIFICATIONS: allow
- extendedWaitUntil:
    visible:
      id: "ru.darkcat.camera:id/cat_ui_field"
    timeout: 30000
- runFlow:
    when:
      visible: "Field ●"
    commands:
      - tapOn:
          id: "ru.darkcat.camera:id/cat_ui_field"
- tapOn:
    id: "ru.darkcat.camera:id/cat_ui_field"
- extendedWaitUntil:
    visible: "Field ●"
    timeout: 30000
- tapOn:
    id: "ru.darkcat.camera:id/cat_ui_gps"
- extendedWaitUntil:
    visible:
      id: "android:id/message"
    timeout: 10000
- copyTextFrom:
    id: "android:id/message"
- evalScript: ${output.fieldGpsOwnership = maestro.copiedText}
- assertTrue: '${output.fieldGpsOwnership.includes("GPS Locker: Field Mode")}'
- takeScreenshot: "cloud-22-23-field-owner"
- tapOn: "Закрыть"
- copyTextFrom:
    id: "ru.darkcat.camera:id/cat_ui_sequence"
- evalScript: ${output.beforeVolumeSequence = maestro.copiedText}
- pressKey: "volume up"
- waitForAnimationToEnd:
    timeout: 15000
- copyTextFrom:
    id: "ru.darkcat.camera:id/cat_ui_sequence"
- evalScript: ${output.afterVolumeSequence = maestro.copiedText}
- runFlow:
    when:
      visible: "Failed to take picture"
    commands:
      - takeScreenshot: "cloud-25-virtual-camera-limitation"
- runFlow:
    when:
      notVisible: "Failed to take picture"
    commands:
      - assertTrue: ${output.afterVolumeSequence != output.beforeVolumeSequence}
      - takeScreenshot: "cloud-25-volume-up"
