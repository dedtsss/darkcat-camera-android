appId: ru.darkcat.camera
name: CAT-16/17/18/19/20/21 lens, orientation and stamp
tags:
  - cat-16
  - cat-17
  - cat-18
  - cat-19
  - cat-20
  - cat-21
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "ru.darkcat.camera:id/cat_ui_lens"
    timeout: 30000
- tapOn:
    id: "ru.darkcat.camera:id/cat_ui_lens"
- extendedWaitUntil:
    visible: "Объективы"
    timeout: 5000
- assertNotVisible: "Camera ID"
- assertNotVisible: "camera id"
- takeScreenshot: "16-lenses"
- pressKey: back
- setOrientation: PORTRAIT
- assertVisible:
    id: "ru.darkcat.camera:id/cat_ui_top_bar"
- takeScreenshot: "20-portrait"
- setOrientation: LANDSCAPE
- assertVisible:
    id: "ru.darkcat.camera:id/cat_ui_top_bar"
- takeScreenshot: "20-landscape"
- setOrientation: PORTRAIT
- tapOn:
    id: "ru.darkcat.camera:id/cat_ui_shutter"
- waitForAnimationToEnd
- takeScreenshot: "21-technical-stamp"
