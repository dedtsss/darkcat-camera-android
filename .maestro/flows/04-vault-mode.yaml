appId: ru.darkcat.camera
name: CAT-13/14/15 deterministic Vault-mode capture and viewer
tags:
  - cat-13
  - cat-14
  - cat-15
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "ru.darkcat.camera:id/cat_ui_storage"
    timeout: 30000
# Make this scenario independent of the mode left by any earlier flow.
- runFlow:
    when:
      visible: "Галерея"
    commands:
      - tapOn:
          id: "ru.darkcat.camera:id/cat_ui_storage"
- extendedWaitUntil:
    visible: "Vault"
    timeout: 5000
- takeScreenshot: "13-vault-mode"
- tapOn:
    id: "ru.darkcat.camera:id/cat_ui_shutter"
- waitForAnimationToEnd
- tapOn:
    id: "ru.darkcat.camera:id/cat_ui_last_shot"
- extendedWaitUntil:
    visible: "Редактор"
    timeout: 15000
- assertVisible: "Поделиться"
- assertVisible: "Удалить"
- takeScreenshot: "13-vault-viewer"
- pressKey: back
- assertVisible:
    id: "ru.darkcat.camera:id/cat_ui_sequence"
- tapOn:
    id: "ru.darkcat.camera:id/cat_ui_sequence"
- extendedWaitUntil:
    visible: "Все кадры"
    timeout: 10000
- assertVisible: "Vault"
- takeScreenshot: "15-vault-gallery-screen"
- pressKey: back
- assertVisible:
    id: "ru.darkcat.camera:id/cat_ui_sequence"
