---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "ru.darkcat.camera:id/cat_ui_settings"
    timeout: 30000
- tapOn:
    id: "ru.darkcat.camera:id/cat_ui_settings"
- tapOn: "Полевой режим"
- extendedWaitUntil:
    visible: "Полевой режим"
    timeout: 5000
- assertVisible: "Volume+ как спуск в полевом режиме"
- assertVisible: "Тест: кадр снят"
- assertVisible: "Тест: отказ"
- assertVisible: "Сила отклика: кадр"
- assertVisible: "Сила отклика: отказ"
- takeScreenshot: "22-field-settings"
- pressKey: BACK
- pressKey: BACK
- assertVisible:
    id: "ru.darkcat.camera:id/cat_ui_field"
- tapOn:
    id: "ru.darkcat.camera:id/cat_ui_field"
- runFlow:
    when:
      visible: "Включить полевой режим?"
    commands:
      - assertVisible: "Android покажет системное уведомление."
      - takeScreenshot: "23-field-safety"
      - tapOn: "Отмена"
