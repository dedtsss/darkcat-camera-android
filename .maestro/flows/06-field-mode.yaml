appId: ru.darkcat.camera
name: CAT-34/35 Field Mode configuration surface
tags:
  - cat-34
  - cat-35
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "ru.darkcat.camera:id/cat_ui_settings"
    timeout: 30000
- tapOn:
    id: "ru.darkcat.camera:id/cat_ui_settings"
- extendedWaitUntil:
    visible: "Камера 0\\.5 · основные категории"
    timeout: 5000
- tapOn:
    id: "ru.darkcat.camera:id/cat_ui_settings_field"
- extendedWaitUntil:
    visible: "Полевой режим"
    timeout: 5000
- assertVisible: "Volume+ как спуск в полевом режиме"
- assertVisible: "Тест: кадр снят"
- assertVisible: "Тест: отказ"
- assertVisible: "Сила отклика: кадр"
- assertVisible: "Сила отклика: отказ"
- takeScreenshot: "22-field-settings"
