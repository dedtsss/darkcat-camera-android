appId: ru.darkcat.camera
name: CAT-09/10/34/35 settings and capability gates
tags:
  - cat-09
  - cat-10
  - cat-34
  - cat-35
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "ru.darkcat.camera:id/cat_ui_settings"
    timeout: 30000
- tapOn:
    id: "ru.darkcat.camera:id/cat_ui_settings"
- extendedWaitUntil:
    visible: "Камера 0\\.5 · основные категории"
    timeout: 5000
- tapOn:
    id: "ru.darkcat.camera:id/cat_ui_settings_capture"
- extendedWaitUntil:
    visible: "Разрешение фото"
    timeout: 5000
- assertVisible: "Баланс белого"
- assertVisible: "Яркость снимка"
- assertVisible: "Вспышка"
- assertVisible: "OEM Night (если камера заявляет capability)"
- assertVisible:
    id: "ru.darkcat.camera:id/cat_ui_settings_save"
- takeScreenshot: "09-settings-capture"
- pressKey: back
- extendedWaitUntil:
    visible: "Камера 0\\.5 · основные категории"
    timeout: 5000
- tapOn:
    id: "ru.darkcat.camera:id/cat_ui_settings_field"
- extendedWaitUntil:
    visible: "Сила отклика: кадр"
    timeout: 5000
- assertVisible: "Тест: кадр снят"
- assertVisible: "Тест: отказ"
- assertVisible: "Сила отклика: отказ"
- takeScreenshot: "34-haptics-settings"
