appId: ru.darkcat.camera
name: CAT-11/12/13/14/15 gallery, Vault and viewer
tags:
  - cat-11
  - cat-12
  - cat-13
  - cat-14
  - cat-15
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "ru.darkcat.camera:id/cat_ui_shutter"
    timeout: 30000
- tapOn:
    id: "ru.darkcat.camera:id/cat_ui_shutter"
- waitForAnimationToEnd
- tapOn:
    id: "ru.darkcat.camera:id/cat_ui_last_shot"
- extendedWaitUntil:
    visible: "Редактор"
    timeout: 15000
- assertVisible: "Поделиться"
- assertVisible: "Удалить"
- takeScreenshot: "12-viewer"
- pressKey: BACK
- assertVisible:
    id: "ru.darkcat.camera:id/cat_ui_top_bar"
